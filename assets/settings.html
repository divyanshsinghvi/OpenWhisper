<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listen Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f5;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b;
        --card: #27272a;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --border: #3f3f46;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 28px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }
    .row:last-of-type { border-bottom: none; }

    .row .label .name { font-weight: 500; }
    .row .label .desc { color: var(--muted); font-size: 12px; margin-top: 2px; }

    select {
      font: inherit;
      color: inherit;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      min-width: 180px;
    }

    .toggle {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }
    .toggle input { display: none; }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 999px;
      transition: background 0.18s ease;
      cursor: pointer;
    }
    .toggle .slider::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: var(--card);
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
      transition: transform 0.18s ease;
    }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(16px); }

    footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 14px 22px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    button {
      font: inherit;
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
    button:hover { filter: brightness(1.04); }

    #status {
      color: var(--muted);
      font-size: 12px;
      margin-right: auto;
      align-self: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Settings</h1>
      <p>Dictation engine, autostart, and recording preferences.</p>
    </header>

    <div class="row">
      <div class="label">
        <div class="name">Transcription engine</div>
        <div class="desc">Streaming engine used when you press the dictation hotkey.</div>
      </div>
      <select id="engine">
        <option value="nemotron-streaming">Nemotron streaming (recommended)</option>
        <option value="moonshine-streaming">Moonshine streaming</option>
        <option value="auto">Auto</option>
      </select>
    </div>

    <div class="row">
      <div class="label">
        <div class="name">Launch at login</div>
        <div class="desc">Start Listen automatically when you sign in.</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="autoStart" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <div class="label">
        <div class="name">Save training data</div>
        <div class="desc">Keep wav recordings + transcripts locally for fine-tuning.</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="saveTrainingData" />
        <span class="slider"></span>
      </label>
    </div>

    <footer>
      <span id="status"></span>
      <button onclick="window.close()">Close</button>
      <button class="primary" id="saveBtn">Save</button>
    </footer>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const ui = {
      engine: document.getElementById('engine'),
      autoStart: document.getElementById('autoStart'),
      saveTrainingData: document.getElementById('saveTrainingData'),
      status: document.getElementById('status'),
      save: document.getElementById('saveBtn'),
    };

    async function load() {
      const settings = await ipcRenderer.invoke('settings:get');
      ui.engine.value = settings.transcriptionEngine || 'nemotron-streaming';
      ui.autoStart.checked = !!settings.autoStart;
      ui.saveTrainingData.checked = !!settings.saveTrainingData;
    }

    async function save() {
      ui.status.textContent = 'Saving…';
      ui.save.disabled = true;
      try {
        await ipcRenderer.invoke('settings:save', {
          transcriptionEngine: ui.engine.value,
          autoStart: ui.autoStart.checked,
          saveTrainingData: ui.saveTrainingData.checked,
        });
        ui.status.textContent = 'Saved. Engine change applies on next launch.';
      } catch (err) {
        ui.status.textContent = 'Save failed: ' + (err && err.message ? err.message : err);
      } finally {
        ui.save.disabled = false;
      }
    }

    ui.save.addEventListener('click', save);
    load();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Mode - Listen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .meeting-container {
      width: 90%;
      max-width: 800px;
      height: 90%;
      max-height: 600px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .meeting-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meeting-info {
      flex: 1;
    }

    .meeting-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .meeting-meta {
      font-size: 14px;
      opacity: 0.9;
    }

    .recording-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 25px;
    }

    .recording-dot {
      width: 12px;
      height: 12px;
      background: #ff4444;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .recording-time {
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .transcript-container {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      background: #f8f9fa;
    }

    .transcript-container.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }

    .empty-state {
      text-align: center;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .empty-state-text {
      font-size: 18px;
      color: #666;
    }

    .transcript-segment {
      margin-bottom: 20px;
      padding: 15px 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .segment-timestamp {
      font-size: 12px;
      color: #667eea;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .segment-text {
      font-size: 16px;
      color: #333;
      line-height: 1.6;
    }

    .progress-bar-container {
      padding: 0 30px 20px;
      background: #f8f9fa;
    }

    .progress-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar {
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      border-radius: 3px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .controls {
      padding: 20px 30px;
      background: white;
      display: flex;
      gap: 15px;
      justify-content: center;
      border-top: 1px solid #e0e0e0;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-danger {
      background: #ff4444;
      color: white;
    }

    .btn-danger:hover {
      background: #cc0000;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 68, 68, 0.4);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn:disabled:hover {
      transform: none;
      box-shadow: none;
    }

    /* Processing overlay */
    .processing-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      z-index: 1000;
    }

    .processing-overlay.active {
      display: flex;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .processing-text {
      font-size: 18px;
      color: #333;
      font-weight: 600;
    }

    .processing-status {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="meeting-container">
    <div class="meeting-header">
      <div class="meeting-info">
        <div class="meeting-title" id="meetingTitle">Meeting Recording</div>
        <div class="meeting-meta" id="meetingMeta">Ready to start</div>
      </div>
      <div class="recording-indicator" id="recordingIndicator" style="display: none;">
        <div class="recording-dot"></div>
        <div class="recording-time" id="recordingTime">00:00</div>
      </div>
    </div>

    <div class="transcript-container empty" id="transcriptContainer">
      <div class="empty-state">
        <div class="empty-state-icon">🎙️</div>
        <div class="empty-state-text">Start recording to begin transcribing</div>
      </div>
    </div>

    <div class="progress-bar-container" id="progressContainer" style="display: none;">
      <div class="progress-label">
        <span id="progressLabel">Processing...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn">
        <span>🔴</span>
        <span>Start Meeting</span>
      </button>
      <button class="btn btn-danger" id="stopBtn" style="display: none;">
        <span>⏹️</span>
        <span>Stop & Transcribe</span>
      </button>
      <button class="btn btn-secondary" id="saveBtn" style="display: none;">
        <span>💾</span>
        <span>Save</span>
      </button>
      <button class="btn btn-secondary" id="exportBtn" style="display: none;">
        <span>📤</span>
        <span>Export</span>
      </button>
      <button class="btn btn-secondary" id="closeBtn">
        <span>✕</span>
        <span>Close</span>
      </button>
    </div>

    <div class="processing-overlay" id="processingOverlay">
      <div class="spinner"></div>
      <div class="processing-text">Transcribing Meeting...</div>
      <div class="processing-status" id="processingStatus">Processing chunk 1 of 10...</div>
    </div>
  </div>

  <script>
    let recordingStartTime = null;
    let timerInterval = null;
    let currentTranscript = null;

    // UI elements
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const saveBtn = document.getElementById('saveBtn');
    const exportBtn = document.getElementById('exportBtn');
    const closeBtn = document.getElementById('closeBtn');
    const recordingIndicator = document.getElementById('recordingIndicator');
    const recordingTime = document.getElementById('recordingTime');
    const transcriptContainer = document.getElementById('transcriptContainer');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const progressPercent = document.getElementById('progressPercent');
    const processingOverlay = document.getElementById('processingOverlay');
    const processingStatus = document.getElementById('processingStatus');
    const meetingMeta = document.getElementById('meetingMeta');

    // Event listeners
    startBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);
    saveBtn.addEventListener('click', saveMeeting);
    exportBtn.addEventListener('click', exportMeeting);
    closeBtn.addEventListener('click', closeMeeting);

    function startRecording() {
      recordingStartTime = Date.now();
      startBtn.style.display = 'none';
      stopBtn.style.display = 'flex';
      recordingIndicator.style.display = 'flex';
      meetingMeta.textContent = 'Recording in progress...';

      // Clear previous transcript
      transcriptContainer.innerHTML = '';
      transcriptContainer.classList.remove('empty');

      // Start timer
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);

      // Notify main process
      window.electron?.send('meeting:start');
    }

    function stopRecording() {
      clearInterval(timerInterval);
      stopBtn.style.display = 'none';
      recordingIndicator.style.display = 'none';
      meetingMeta.textContent = 'Processing transcription...';

      // Show processing overlay
      processingOverlay.classList.add('active');

      // Notify main process
      window.electron?.send('meeting:stop');
    }

    function updateTimer() {
      if (!recordingStartTime) return;

      const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
      const minutes = Math.floor(elapsed / 60);
      const seconds = elapsed % 60;

      recordingTime.textContent =
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function updateProgress(current, total, percent) {
      progressFill.style.width = `${percent}%`;
      progressPercent.textContent = `${percent}%`;
      processingStatus.textContent = `Processing chunk ${current} of ${total}...`;
    }

    function addTranscriptSegment(timestamp, text) {
      const segment = document.createElement('div');
      segment.className = 'transcript-segment';
      segment.innerHTML = `
        <div class="segment-timestamp">[${timestamp}]</div>
        <div class="segment-text">${text}</div>
      `;
      transcriptContainer.appendChild(segment);
      transcriptContainer.scrollTop = transcriptContainer.scrollHeight;
    }

    function transcriptionComplete(transcript) {
      processingOverlay.classList.remove('active');
      saveBtn.style.display = 'flex';
      exportBtn.style.display = 'flex';
      startBtn.style.display = 'flex';
      meetingMeta.textContent = 'Transcription complete';
      currentTranscript = transcript;

      // Display segments
      transcriptContainer.innerHTML = '';
      transcript.segments.forEach(segment => {
        addTranscriptSegment(formatTimestamp(segment.startTime), segment.text);
      });
    }

    function formatTimestamp(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function saveMeeting() {
      window.electron?.send('meeting:save');
    }

    function exportMeeting() {
      window.electron?.send('meeting:export');
    }

    function closeMeeting() {
      window.electron?.send('meeting:close');
    }

    // Listen for IPC messages from main process
    window.electron?.on('meeting:progress', (data) => {
      updateProgress(data.current, data.total, data.percent);
    });

    window.electron?.on('meeting:complete', (transcript) => {
      transcriptionComplete(transcript);
    });

    window.electron?.on('meeting:error', (error) => {
      processingOverlay.classList.remove('active');
      alert('Error: ' + error);
      startBtn.style.display = 'flex';
      stopBtn.style.display = 'none';
      recordingIndicator.style.display = 'none';
    });
  </script>
</body>
</html>

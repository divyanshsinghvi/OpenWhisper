<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OpenWhisper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 20px;
    }

    /* Ultra-minimal wave indicator bar */
    #floating-button {
      width: 75px;
      height: 20px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      padding: 0 8px;
    }

    #floating-button:hover {
      background: rgba(255, 255, 255, 1);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    /* Wave bars */
    .wave-bar {
      width: 2px;
      height: 6px;
      background: #9ca3af;
      border-radius: 1px;
      transition: all 0.1s ease;
    }

    /* Recording state - animated waves */
    #floating-button.recording {
      background: rgba(239, 68, 68, 0.9);
      border-color: rgba(220, 38, 38, 0.2);
    }

    #floating-button.recording .wave-bar {
      background: #ffffff;
      animation: wave 0.8s ease-in-out infinite;
    }

    #floating-button.recording .wave-bar:nth-child(1) { animation-delay: 0s; }
    #floating-button.recording .wave-bar:nth-child(2) { animation-delay: 0.1s; }
    #floating-button.recording .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    #floating-button.recording .wave-bar:nth-child(4) { animation-delay: 0.3s; }
    #floating-button.recording .wave-bar:nth-child(5) { animation-delay: 0.2s; }
    #floating-button.recording .wave-bar:nth-child(6) { animation-delay: 0.1s; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }

    /* Processing state */
    #floating-button.processing {
      background: rgba(251, 146, 60, 0.9);
      border-color: rgba(249, 115, 22, 0.2);
    }

    #floating-button.processing .wave-bar {
      background: #ffffff;
      animation: pulse-bar 1s ease-in-out infinite;
    }

    @keyframes pulse-bar {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Transcript preview (slides up) */
    #transcript-preview {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      min-width: 200px;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(30px);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #1f2937;
      line-height: 1.5;
    }

    #transcript-preview.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

  </style>
</head>
<body>
  <div id="transcript-preview"></div>

  <div id="floating-button" class="idle">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>

  <script>
    const button = document.getElementById('floating-button');
    const preview = document.getElementById('transcript-preview');

    // Click to toggle recording
    button.addEventListener('click', () => {
      if (window.electron) {
        window.electron.send('floating-button-click');
      }
    });

    // Listen for state updates
    if (window.electron) {
      window.electron.on('floating-button-state', ({ state }) => {
        button.className = state;

        // Hide preview when not recording
        if (state !== 'recording' && state !== 'processing') {
          preview.classList.remove('visible');
        }
      });

      window.electron.on('transcript-update', ({ text }) => {
        if (text && text.trim()) {
          preview.textContent = text;
          preview.classList.add('visible');

          // Auto-hide after 3 seconds
          setTimeout(() => {
            preview.classList.remove('visible');
          }, 3000);
        }
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OpenWhisper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 20px;
    }

    /* Minimal floating button */
    #floating-button {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    #floating-button:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    /* Recording state - red with pulse */
    #floating-button.recording {
      background: rgba(239, 68, 68, 0.95);
      border-color: rgba(220, 38, 38, 0.3);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 8px 40px rgba(239, 68, 68, 0.5);
      }
    }

    /* Processing state */
    #floating-button.processing {
      background: rgba(251, 146, 60, 0.95);
      border-color: rgba(249, 115, 22, 0.3);
    }

    .mic-icon {
      width: 24px;
      height: 24px;
      fill: #6b7280;
      transition: fill 0.2s;
    }

    #floating-button.recording .mic-icon {
      fill: #ffffff;
    }

    #floating-button.processing .mic-icon {
      fill: #ffffff;
    }

    /* Transcript preview (slides up) */
    #transcript-preview {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      min-width: 200px;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(30px);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #1f2937;
      line-height: 1.5;
    }

    #transcript-preview.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Status indicator */
    #status-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      border-radius: 6px;
      background: #10b981;
      border: 2px solid rgba(255, 255, 255, 0.95);
      opacity: 0;
      transition: opacity 0.2s;
    }

    #floating-button.recording #status-dot {
      opacity: 1;
      background: #ef4444;
      animation: blink 1s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Minimal tooltip */
    #tooltip {
      position: absolute;
      bottom: -32px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    #floating-button:hover #tooltip {
      opacity: 1;
    }

    #floating-button.recording:hover #tooltip {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="transcript-preview"></div>

  <div id="floating-button" class="idle">
    <svg class="mic-icon" viewBox="0 0 24 24">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
    <div id="status-dot"></div>
    <div id="tooltip">Cmd+Shift+Space</div>
  </div>

  <script>
    const button = document.getElementById('floating-button');
    const preview = document.getElementById('transcript-preview');

    // Click to toggle recording
    button.addEventListener('click', () => {
      if (window.electron) {
        window.electron.send('floating-button-click');
      }
    });

    // Listen for state updates
    if (window.electron) {
      window.electron.on('floating-button-state', ({ state }) => {
        button.className = state;

        // Hide preview when not recording
        if (state !== 'recording' && state !== 'processing') {
          preview.classList.remove('visible');
        }
      });

      window.electron.on('transcript-update', ({ text }) => {
        if (text && text.trim()) {
          preview.textContent = text;
          preview.classList.add('visible');

          // Auto-hide after 3 seconds
          setTimeout(() => {
            preview.classList.remove('visible');
          }, 3000);
        }
      });
    }
  </script>
</body>
</html>

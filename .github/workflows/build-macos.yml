name: Build macOS DMG

on:
  push:
    branches: [ main, voice-shortcuts, "claude/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14  # arm64 runner — must match our DMG target
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python (for install-nemotron.sh huggingface_hub download)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install npm dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # python-build-standalone tarball — ~25MB download; cache so re-runs skip it.
      - name: Cache python-build-standalone tarball
        uses: actions/cache@v4
        with:
          path: build/cpython-*.tar.gz
          key: pybs-${{ runner.os }}-${{ runner.arch }}-20260510-3.12.13

      - name: Bundle relocatable Python runtime + sherpa-onnx into build/python
        run: bash packaging/bundle-python-darwin-arm64.sh

      # Nemotron model is ~600MB; cache the HF download dir between runs.
      - name: Cache HuggingFace download
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nemotron-streaming-en-0.6b-int8-v1

      - name: Download Nemotron streaming model into models/
        run: bash install-nemotron.sh

      - name: Verify extraResources sources exist
        run: |
          test -x build/python/bin/python3 || { echo "[fail] missing build/python/bin/python3"; exit 1; }
          test -f models/nemotron-streaming-en-0.6b-int8/encoder.int8.onnx || { echo "[fail] missing nemotron model"; exit 1; }
          test -f python/nemotron_streaming_server.py || { echo "[fail] missing server script"; exit 1; }
          test -f build/icon.png || echo "[warn] no icon.png; default Electron icon will be used"

      - name: Build macOS DMG
        run: npm run package -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false  # unsigned build — Gatekeeper will warn on first launch

      - name: List build artifacts
        run: ls -lh release/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWhisper-macOS-arm64-DMG
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

      # Tag-driven release: pushing a tag like v1.0.1 attaches the DMG to a
      # GitHub Release with the same name. Skipped on branch pushes / PRs.
      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  build-summary:
    runs-on: ubuntu-latest
    needs: build-macos
    if: always()

    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: OpenWhisper-macOS-arm64-DMG
          path: ./artifacts

      - name: Create summary
        run: |
          {
            echo "## OpenWhisper macOS DMG"
            echo ""
            echo "**Download:** Actions run → Artifacts → \`OpenWhisper-macOS-arm64-DMG\`"
            echo ""
            ls -lh ./artifacts/*.dmg 2>/dev/null | awk '{printf "- `%s` (%s)\n", $9, $5}' || echo "- (no DMG)"
            echo ""
            echo "### Install"
            echo "1. Open the DMG and drag OpenWhisper to /Applications."
            echo "2. First launch is blocked by Gatekeeper (unsigned). Right-click → Open → Open."
            echo "3. Grant Accessibility in System Settings → Privacy & Security → Accessibility."
            echo "4. Press ⌘⇧Space to start dictation."
            echo ""
            echo "Self-contained: bundled Python 3.12 runtime + sherpa-onnx + Nemotron streaming model. No \`brew install\` required."
          } >> "$GITHUB_STEP_SUMMARY"

name: Build macOS DMG

on:
  push:
    branches: [ main, claude/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build macOS DMG
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false  # Disable code signing (not needed for testing)

      - name: List build artifacts
        run: ls -la release/

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: OpenWhisper-macOS-DMG
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: |
            release/*.yml
            package.json
          if-no-files-found: warn

  build-summary:
    runs-on: ubuntu-latest
    needs: build-macos
    if: always()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: OpenWhisper-macOS-DMG
          path: ./artifacts

      - name: Create summary
        run: |
          echo "## 📦 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### macOS DMG Ready for Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download from:** GitHub Actions → Artifacts → OpenWhisper-macOS-DMG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files:**" >> $GITHUB_STEP_SUMMARY
          ls -lh ./artifacts/*.dmg | awk '{printf "- `%s` (%s)\n", $9, $5}' >> $GITHUB_STEP_SUMMARY || echo "- No DMG files found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Installation:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the DMG from artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Open the DMG file" >> $GITHUB_STEP_SUMMARY
          echo "3. Drag OpenWhisper to Applications folder" >> $GITHUB_STEP_SUMMARY
          echo "4. Install sox: \`brew install sox\`" >> $GITHUB_STEP_SUMMARY
          echo "5. Install a model: \`./install-moonshine.sh\`" >> $GITHUB_STEP_SUMMARY
